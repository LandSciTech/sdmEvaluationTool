    materials_read: Yes
    materials_create_new: No
    materials_edit_own: No
    materials_edit_all: No
    materials_delete: No
    evaluations_read: Yes
    evaluations_create_new: No
    evaluations_edit_own: No
    evaluations_edit_all: No
    evaluations_delete: No
    discussions_read: No
    discussions_write: No

  commenter:
    name: Commenter
    materials_read: Yes
    materials_create_new: No
    materials_edit_own: No
    materials_edit_all: No
    materials_delete: No
    evaluations_read: Yes
    evaluations_create_new: No
    evaluations_edit_own: No
    evaluations_edit_all: No
    evaluations_delete: No
    discussions_read: Yes
    discussions_write: Yes

  evaluator:
    name: Evaluator
    materials_read: Yes
    materials_create_new: No
    materials_edit_own: No
    materials_edit_all: No
    materials_delete: No
    evaluations_read: Yes
    evaluations_create_new: Yes
    evaluations_edit_own: Yes
    evaluations_edit_all: No
    evaluations_delete: No
    discussions_read: Yes
    discussions_write: Yes

  modeler:
    name: Modeler
    materials_read: Yes
    materials_create_new: Yes
    materials_edit_own: Yes
    materials_edit_all: No
    materials_delete: No
    evaluations_read: Yes
    evaluations_create_new: No
    evaluations_edit_own: No
    evaluations_edit_all: No
