name: sdmEvalToolUp

on:
  push:
    branches: ["main"]
    paths:
      - "sdmEvalToolUp/**"
      - "sdmEvalToolCore/**"
      - ".github/workflows/check-up.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "sdmEvalToolUp/**"
      - "sdmEvalToolCore/**"
      - ".github/workflows/check-up.yml"

permissions:
  contents: read

jobs:
  check_and_build_up:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
      - name: Install dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps("sdmEvalToolUp", dependencies = TRUE)
          remotes::install_local("sdmEvalToolCore", dependencies = TRUE, upgrade = "never")
        shell: Rscript {0}
      - name: Check
        run: rcmdcheck::rcmdcheck("sdmEvalToolUp", args = "--no-manual", error_on = "warning")
        shell: Rscript {0}
